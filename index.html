		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #fbf1e2;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

<link rel="manifest" href="index.manifest.json">
<!-- Patte blanche : pont JavaScript pour l'export Web de Godot.
     Injecté dans Exporter > Web > HTML > Head Include par tools/exporter_web.py (ne pas coller à la main).
     Voir docs/architecture/adr-0004-camera-web.md et adr-0005-saisie-texte-ipad.md.
     Safari n'autorise la caméra, le partage, les téléchargements et le clavier que pendant un vrai geste :
     Godot « arme » l'action quand le doigt se pose (pbArmer), et ce script l'exécute au relâcher. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patte blanche">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FBF1E2">
<style>
  @font-face { font-family: "Nunito PB"; src: url("Nunito-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
  html, body { background: #FBF1E2; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #pb-champ { position: fixed; z-index: 10; box-sizing: border-box; margin: 0; border: 0; outline: 0; background: transparent;
    font-family: "Nunito PB", "Avenir Next", system-ui, sans-serif; font-weight: 700; color: #6B4F3A; caret-color: #D0638B;
    -webkit-user-select: text; user-select: text; -webkit-appearance: none; appearance: none; border-radius: 0; }
</style>
<script>
(function () {
  "use strict";
  let arme = null;
  let rappelPhoto = null;     // fonction Godot (JavaScriptBridge.create_callback) qui reçoit le JPEG en base64
  let rappelFichier = null;   // fonction Godot qui reçoit le texte d'un fichier importé (sauvegarde)
  let rappelTexte = null;     // fonction Godot qui reçoit (texte, fini) pendant la saisie au clavier
  let wakeLock = null;

  window.pbEnregistrerRappelPhoto = function (cb) { rappelPhoto = cb; };
  window.pbEnregistrerRappelFichier = function (cb) { rappelFichier = cb; };
  window.pbEnregistrerRappelTexte = function (cb) { rappelTexte = cb; };
  // type : "camera" (option "environment" ou "user"), "galerie", "partage" (donnees = {b64, nom}),
  //        "telecharger" (donnees = {texte, nom, type}), "importer", "clavier" (donnees = voir ouvrirChamp)
  // donnees peut arriver en texte JSON (Godot ne sait pas passer un objet JavaScript directement).
  window.pbArmer = function (type, option, donnees) {
    if (typeof donnees === "string" && donnees.length > 0) { try { donnees = JSON.parse(donnees); } catch (e) { donnees = null; } }
    arme = { type: type, option: option, donnees: donnees };
  };
  window.pbDesarmer = function () { arme = null; };

  // Infos pour le diagnostic du panneau jury : lancé depuis l'icône ? en ligne ?
  window.pbInfos = function () {
    const standalone = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
    return JSON.stringify({ standalone: !!standalone, en_ligne: navigator.onLine, agent: navigator.userAgent,
      ecran: [window.screen.width, window.screen.height], fenetre: [window.innerWidth, window.innerHeight], dpr: window.devicePixelRatio });
  };
  // Part de la hauteur de la fenêtre cachée par le clavier de l'iPad (0 si aucun).
  window.pbHauteurClavier = function () {
    const vv = window.visualViewport;
    if (!vv || !window.innerHeight) return 0;
    return Math.max(0, Math.min(0.9, 1 - (vv.height + vv.offsetTop) / window.innerHeight));
  };

  function base64DepuisBlob(blob) {
    return blob.arrayBuffer().then(function (ab) {
      const buf = new Uint8Array(ab);
      let bin = "";
      for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
      return btoa(bin);
    });
  }

  async function versJpegBase64(fichier) {
    const bmp = await createImageBitmap(fichier, { imageOrientation: "from-image" });
    const k = Math.min(1, 1440 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k);
    c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    if (bmp.close) bmp.close();
    const blob = await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.9); });
    return base64DepuisBlob(blob);
  }

  function ouvrirSelecteurImage(capture) {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    if (capture) input.setAttribute("capture", capture);
    input.style.display = "none";
    document.body.appendChild(input);
    let fini = false;
    function rendre(valeur) { if (fini) return; fini = true; input.remove(); if (rappelPhoto) rappelPhoto(valeur); }
    input.addEventListener("change", async function () {
      const f = input.files && input.files[0];
      if (!f) { rendre(""); return; }
      try { rendre(await versJpegBase64(f)); } catch (e) { rendre("ERREUR"); }
    });
    // Safari 16.4+ envoie « cancel » quand on ferme l'appareil photo sans photo ; Godot garde aussi un bouton Annuler.
    input.addEventListener("cancel", function () { rendre(""); });
    input.click();
  }

  function importerFichierTexte() {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "application/json,.json";
    input.style.display = "none";
    document.body.appendChild(input);
    input.addEventListener("change", async function () {
      const f = input.files && input.files[0];
      input.remove();
      if (rappelFichier) rappelFichier(f ? await f.text() : "");
    });
    input.addEventListener("cancel", function () { input.remove(); if (rappelFichier) rappelFichier(""); });
    input.click();
  }

  function blobDepuisBase64(b64, type) {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type: type });
  }

  function telecharger(blob, nom) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = nom;
    document.body.appendChild(a);
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  function partager(d) {
    if (!d || !d.b64) return;
    const blob = blobDepuisBase64(d.b64, "image/jpeg");
    const fichier = new File([blob], d.nom || "patte-blanche.jpg", { type: "image/jpeg" });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) {
      navigator.share({ files: [fichier], title: "Patte blanche" }).catch(function () {});
    } else {
      telecharger(blob, fichier.name);
    }
  }

  // Vrai champ HTML posé sur le champ dessiné par Godot (ADR 0005, option 2) : le clavier de l'iPad
  // ne s'ouvre que si un élément HTML prend le focus pendant le geste.
  // d = { x, y, l, h : rectangle en fractions du canvas ; texte ; max ; taille : police en fraction de la hauteur du canvas ;
  //       marge : retrait du texte en fraction de la largeur du canvas ; indice : texte d'indication }
  function ouvrirChamp(d) {
    if (!d) return;
    const canvas = document.querySelector("canvas");
    if (!canvas) return;
    const r = canvas.getBoundingClientRect();
    let champ = document.getElementById("pb-champ");
    if (!champ) {
      champ = document.createElement("input");
      champ.id = "pb-champ";
      champ.type = "text";
      champ.autocomplete = "off";
      champ.setAttribute("autocapitalize", "sentences");
      champ.setAttribute("enterkeyhint", "done");
      champ.spellcheck = false;
      document.body.appendChild(champ);
      champ.addEventListener("input", function () { if (rappelTexte) rappelTexte(champ.value, 0); });
      champ.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); champ.blur(); } });
      champ.addEventListener("blur", function () {
        const v = champ.value;
        champ.style.display = "none";
        if (rappelTexte) rappelTexte(v, 1);
      });
    }
    champ.maxLength = d.max || 140;
    champ.placeholder = d.indice || "";
    champ.value = d.texte || "";
    champ.style.left = (r.left + d.x * r.width) + "px";
    champ.style.top = (r.top + d.y * r.height) + "px";
    champ.style.width = (d.l * r.width) + "px";
    champ.style.height = (d.h * r.height) + "px";
    champ.style.fontSize = Math.max(16, d.taille * r.height) + "px";
    champ.style.paddingLeft = champ.style.paddingRight = ((d.marge || 0) * r.width) + "px";
    champ.style.display = "block";
    champ.focus();
    const n = champ.value.length;
    try { champ.setSelectionRange(n, n); } catch (e) { /* rien */ }
  }
  window.pbFermerChamp = function () { const champ = document.getElementById("pb-champ"); if (champ) champ.blur(); };

  async function garderEcranAllume() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", function () { wakeLock = null; });
      }
    } catch (e) { /* pas grave */ }
  }

  function executer() {
    garderEcranAllume();
    if (!arme) return;
    const a = arme;
    arme = null;
    if (a.type === "camera") ouvrirSelecteurImage(a.option || "environment");
    else if (a.type === "galerie") ouvrirSelecteurImage(null);
    else if (a.type === "partage") partager(a.donnees);
    else if (a.type === "telecharger" && a.donnees) telecharger(new Blob([a.donnees.texte], { type: a.donnees.type || "application/json" }), a.donnees.nom);
    else if (a.type === "importer") importerFichierTexte();
    else if (a.type === "clavier") ouvrirChamp(a.donnees);
  }

  window.addEventListener("pointerup", executer, true);
  window.addEventListener("touchend", executer, true);
  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "visible") garderEcranAllume();
  });
  // demander un stockage persistant (Safari peut refuser sans conséquence)
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
})();
</script>

		<canvas id="canvas">
			Your browser does not support the canvas tag.

			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--false fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":20347476,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
